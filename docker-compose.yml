version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: tripcircle-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: tripcircle
      MYSQL_USER: tripcircle
      MYSQL_PASSWORD: tripcircle_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: tripcircle-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://tripcircle:tripcircle_pass@mysql:3306/tripcircle
      JWT_ACCESS_SECRET: production-secret-access-token-key-change-me
      JWT_REFRESH_SECRET: production-secret-refresh-token-key-change-me
      STORAGE_DRIVER: local
      LOCAL_UPLOAD_DIR: /app/uploads
    ports:
      - "3000:3000"
    volumes:
      - api_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
  api_uploads:
