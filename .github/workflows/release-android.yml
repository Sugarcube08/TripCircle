name: Release Android App & Ledger Engine

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Semantic Version (e.g. 1.2.5)'
        required: false
        default: '1.2.5'
      version_code:
        description: 'Android Version Code (e.g. 3)'
        required: false
        default: '3'
      release_notes:
        description: 'Release summary notes'
        required: false
        default: 'TripCircle 1.2.5: Payee & split edits, PDF report design overhaul, and resilient auth refresh.'

jobs:
  build-and-release:
    name: Build & Release Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tripcircle
          MYSQL_USER: tripcircle
          MYSQL_PASSWORD: tripcircle_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -utripcircle -ptripcircle_pass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql://tripcircle:tripcircle_pass@127.0.0.1:3306/tripcircle
      TEST_DATABASE_URL: mysql://tripcircle:tripcircle_pass@127.0.0.1:3306/tripcircle
      JWT_ACCESS_SECRET: ci-only-access-secret-not-for-deployment-1234567890abcdef
      JWT_REFRESH_SECRET: ci-only-refresh-secret-not-for-deployment-abcdef1234567890

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Cache Gradle Caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set release version metadata
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version_name }}"
          if [ -z "$VERSION" ]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          VERSION_CODE="${{ github.event.inputs.version_code }}"
          if [ -z "$VERSION_CODE" ]; then VERSION_CODE=$(node -p "require('./apps/mobile/app.json').expo.android.versionCode"); fi
          node -e "const fs=require('fs'); const p='apps/mobile/app.json'; const j=JSON.parse(fs.readFileSync(p,'utf8')); j.expo.version='$VERSION'; j.expo.android.versionCode=Number('$VERSION_CODE'); fs.writeFileSync(p, JSON.stringify(j,null,2)+'\\n');"
          echo "Building TripCircle v$VERSION (Android build $VERSION_CODE)"

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @tripcircle/api db:generate

      - name: Apply Database Migrations
        run: pnpm --filter @tripcircle/api db:migrate

      - name: Synchronize Test Database Schema
        run: pnpm --filter @tripcircle/api exec prisma db push --accept-data-loss

      - name: Typecheck Packages & Apps
        run: pnpm typecheck

      - name: Run Test Suite
        run: pnpm test

      - name: Create Production Environment (.env)
        shell: bash
        run: |
          cat << 'EOF' > apps/mobile/.env
          EXPO_PUBLIC_API_URL=https://api-eta-liard-50.vercel.app/api/v1
          EXPO_PUBLIC_UPDATE_METADATA_URL=https://api-eta-liard-50.vercel.app/version.json
          NODE_ENV=production
          EOF
          cp apps/mobile/.env .env
          echo "✅ Production .env created:"
          cat apps/mobile/.env

      - name: Prepare Android Build
        run: |
          cd apps/mobile
          npx expo prebuild --platform android --no-install

      - name: Build Android Release APK and AAB
        run: |
          sed -i '/org.gradle.java.home/d' apps/mobile/android/gradle.properties 2>/dev/null || true
          cd apps/mobile/android
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Locate Built Artifacts and Compute Checksums
        id: apk_info
        run: |
          APK_PATH=$(find apps/mobile/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK not found!"
            exit 1
          fi
          AAB_PATH=$(find apps/mobile/android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          if [ -z "$AAB_PATH" ]; then
            echo "ERROR: AAB not found!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          echo "Found AAB at: $AAB_PATH"
          cp "$APK_PATH" ./TripCircle-release.apk
          cp "$AAB_PATH" ./TripCircle-release.aab
          
          SHA256_APK=$(sha256sum ./TripCircle-release.apk | awk '{print $1}')
          SHA256_AAB=$(sha256sum ./TripCircle-release.aab | awk '{print $1}')
          echo "sha256=$SHA256_APK" >> $GITHUB_OUTPUT
          echo "sha256_aab=$SHA256_AAB" >> $GITHUB_OUTPUT
          echo "APK SHA256: $SHA256_APK"
          echo "AAB SHA256: $SHA256_AAB"

          # Determine Tag and Version
          REF_TAG="${{ github.ref_name }}"
          if [[ "$REF_TAG" =~ ^v ]]; then
            VER="${REF_TAG#v}"
          else
            VER="${{ github.event.inputs.version_name || '1.2.5' }}"
          fi
          echo "version=$VER" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TripCircle-Release-APK
          path: TripCircle-release.apk
          retention-days: 30

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TripCircle-Release-AAB
          path: TripCircle-release.aab
          retention-days: 30

      - name: Generate release version manifest
        run: |
          node scripts/generate-version-manifest.mjs \
            --notes "Lifecycle-aware trip actions and permanent trip deletion." \
            --notes "Expense and pending-payment edit/delete workflows with audit-safe financial history." \
            --notes "Offline-member expense detail crash fix and corrected total-spent metric." \
            --sha256 "${{ steps.apk_info.outputs.sha256 }}" \
            --apk-url "https://github.com/${{ github.repository }}/releases/download/v${{ steps.apk_info.outputs.version }}/TripCircle-release.apk" \
            --release-url "https://github.com/${{ github.repository }}/releases/tag/v${{ steps.apk_info.outputs.version }}"

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk_info.outputs.version }}
          name: TripCircle v${{ steps.apk_info.outputs.version }}
          body: |
            ## TripCircle v${{ steps.apk_info.outputs.version }}
            
            ${{ github.event.inputs.release_notes || 'Release build with paise-exact financial ledger, secure R2 pre-registration QR onboarding, and in-app updates.' }}
            
            ### Artifact Integrity Verification
            - **APK Filename:** `TripCircle-release.apk`
            - **APK SHA-256:** `${{ steps.apk_info.outputs.sha256 }}`
            - **AAB Filename:** `TripCircle-release.aab`
            - **AAB SHA-256:** `${{ steps.apk_info.outputs.sha256_aab }}`
          files: |
            TripCircle-release.apk
            TripCircle-release.aab
            version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
