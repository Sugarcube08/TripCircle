name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Workspace validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: mysql://test:test@127.0.0.1:3306/tripcircle
      JWT_ACCESS_SECRET: ci-only-access-secret-at-least-32-characters
      JWT_REFRESH_SECRET: ci-only-refresh-secret-at-least-32-characters
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @tripcircle/api exec prisma generate

      - name: Typecheck all workspaces
        run: pnpm typecheck

      - name: Validate release manifest
        run: pnpm manifest:validate

      - name: Run API tests
        run: pnpm test
