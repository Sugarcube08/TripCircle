<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240">
  <defs>
    <linearGradient id="logoTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="logoCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Icon Mark (Centered at 120, 120) -->
  <g transform="translate(120, 120) scale(0.24)">
    <!-- Outer Orbit Ring -->
    <circle cx="0" cy="0" r="340" fill="none" stroke="#1e293b" stroke-width="8" stroke-dasharray="16 12" />

    <!-- Arcs -->
    <path d="M 0 -320 A 320 320 0 0 1 277 160" fill="none" stroke="url(#logoTeal)" stroke-width="64" stroke-linecap="round" filter="url(#logoGlow)" />
    <path d="M 208 223 A 320 320 0 0 1 -277 160" fill="none" stroke="url(#logoCyan)" stroke-width="64" stroke-linecap="round" filter="url(#logoGlow)" />
    <path d="M -277 -160 A 320 320 0 0 1 0 -320" fill="none" stroke="#10b981" stroke-width="64" stroke-linecap="round" filter="url(#logoGlow)" />

    <!-- Nodes -->
    <circle cx="0" cy="-320" r="44" fill="#ffffff" />
    <circle cx="0" cy="-320" r="24" fill="#14b8a6" />

    <circle cx="238" cy="188" r="44" fill="#ffffff" />
    <circle cx="238" cy="188" r="24" fill="#0ea5e9" />

    <circle cx="-238" cy="188" r="44" fill="#ffffff" />
    <circle cx="-238" cy="188" r="24" fill="#10b981" />

    <!-- Compass Rose -->
    <circle cx="0" cy="0" r="110" fill="#0f172a" stroke="#334155" stroke-width="8" />
    <polygon points="0,-76 38,20 0,0" fill="#2dd4bf" />
    <polygon points="0,-76 -38,20 0,0" fill="#0d9488" />
    <polygon points="0,76 38,-20 0,0" fill="#64748b" />
    <polygon points="0,76 -38,-20 0,0" fill="#475569" />
    <circle cx="0" cy="0" r="14" fill="#ffffff" />
    <circle cx="0" cy="0" r="7" fill="#0f172a" />
  </g>

  <!-- Typography -->
  <g transform="translate(250, 135)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="76" font-weight="800" fill="#ffffff" letter-spacing="-2">
      trip<tspan fill="#14b8a6">Circle</tspan>
    </text>
    <text y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#94a3b8" letter-spacing="4">
      SHARED TRIP LEDGER
    </text>
  </g>
</svg>
